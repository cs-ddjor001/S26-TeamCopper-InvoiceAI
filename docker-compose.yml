services:
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ai2-mailhog
    ports:
      - "1025:1025"  # SMTP - where senders connect
      - "8025:8025"  # Web UI + JSON API
    restart: unless-stopped
  redis:
    image: redis
    ports:
      - "6379:6379"
  redis-commander:
    image: rediscommander/redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
